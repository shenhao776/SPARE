/**:
    ros__parameters:
      registration_method: "NDT_OMP"
      score_threshold: 0.5

      reloc_yaw_search_deg: 60.0
      reloc_prior_pos_weight: 0.0
      reloc_prior_yaw_weight: 0.0
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      ndt_num_threads: 4
      ndt_max_iterations: 35
      transform_epsilon: 0.01
      voxel_leaf_size: 0.2
      scan_max_range: 100.0
      scan_min_range: 1.0
      scan_period: 0.1
      use_pcd_map: true
      map_viz_leaf_size: 0.15
      map_path: "/root/datasets/my_map_data/PCD/map_final_visualization.pcd"
      set_initial_pose: true


      initial_pose_x: 0.0
      initial_pose_y: 0.0
      initial_pose_z: 0.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.0
      initial_pose_qw: 1.0

      use_odom: true
      use_imu: false
      imu_topic: /livox/imu
      enable_debug: false
      global_frame_id: map
      odom_frame_id: livox_odom
      base_frame_id: base_link
