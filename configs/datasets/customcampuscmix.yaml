name: CustomCampusCmix
pose_format: custom
data_root: datasets/CustomCampusCmix
thresholds:
  train_m: 8.0
  test_m: 5.0
build:
  min_dist: 0.3
  min_angle: 10.0
  intervals: {train: 2, val: 2, test: 1}
  raw_root: datasets/database_raw_processed/CustomCampus
  image_subdir: undistorted_images
  map_boundary_dist: 15.0
  full_frame_recordings: [recording_dusk, recording_night, recording_full]
  splits:
    database: [recording_mapping]
    train:    [recording_mapping]
    val:      [recording_1]
    test:     [recording_full]
  crop: {top_excl: 0.0, bottom_excl: 0.3, min_ratio: 0.3, max_ratio: 1.0}

sequence:
  spatial_steps: [10, 10]
  step_feature_tau: 0.05
  step_max_dist: 2.5
  step_budget: 0.922
