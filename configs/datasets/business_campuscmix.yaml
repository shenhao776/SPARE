name: BusinessCampusCmix
pose_format: fourseasons
data_root: datasets/BusinessCampusCmix
thresholds:
  train_m: 8.0
  test_m: 5.0
build:
  min_dist: 1.0
  min_angle: 10.0
  intervals: {train: 1, val: 3, test: 6}
  raw_root: datasets/database_raw_processed/BusinessCampus
  image_subdir: undistorted_images
  map_boundary_dist: 15.0
  splits:
    database: [recording_mapping]
    train:    [recording_mapping]
    val:      [recording_1]
    test:     [recording_2]
  crop: {top_excl: 0.0, bottom_excl: 0.3, min_ratio: 0.3, max_ratio: 1.0}

sequence:
  spatial_steps: [10, 10]
  step_feature_tau: 0.05
  step_max_dist: 2.5
  step_budget: 0.514
