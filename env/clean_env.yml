name: vpr_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pyyaml
  - pillow
  - tqdm
  - einops=0.8.2
  - matplotlib
  - numpy=1.26.4
  - scipy=1.15.3
  - git
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0
      - torchvision==0.26.0
      - faiss-gpu==1.7.2
      - opencv-python==4.11.0.86
      - pytorch-lightning==2.6.1
      - pytorch-metric-learning==2.9.0
      - shapely==2.1.2
      - huggingface_hub==1.7.2
      - safetensors==0.7.0
      - timm==1.0.25
      - transformers==5.4.0
      - fast-pytorch-kmeans
      - gdown>=5.2
      - lightglue @ git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8
